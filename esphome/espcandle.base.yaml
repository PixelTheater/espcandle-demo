# ESP Candle - shared base configuration.
#
# This file defines all hardware, provisioning, and diagnostic entities for
# the ESP Candle PCB (see project README for hardware details). It is meant
# to be included as a package from a small per-device YAML, e.g.:
#
#   substitutions:
#     name: esp32-candle-livingroom
#     friendly_name: Living Room Candle
#   packages:
#     espcandle: !include espcandle.base.yaml
#
# Or remotely:
#
#   packages:
#     espcandle: github://PixelTheater/espcandle-demo/esphome/espcandle.base.yaml@main
#
# Out of the box, a freshly flashed candle:
#   - comes up as a Wi-Fi AP with a captive portal
#   - accepts Wi-Fi credentials over USB-CDC (improv-serial) and BLE (esp32_improv)
#   - is discovered by Home Assistant via the native API once on Wi-Fi
#   - accepts OTA updates from Home Assistant or the ESPHome CLI
#
# Only ONE light is exposed to Home Assistant by default: "ESP Candle" (the
# RGB strip + master brightness for PWM). Presets are scenes (effect + default
# brightness). Warm white, UV, and deep red are driven via ledc — config
# number sliders for Custom mix. See docs/modders.md.

substitutions:
  name: esp32-candle
  friendly_name: ESP Candle
  room: ""
  device_description: "ESP32-S3 powered smart tea candle (RGB + warm white + UV + deep red)"
  project_name: "PixelTheater.ESP Candle"
  project_version: "0.3.0"

  # Logging level: NONE, ERROR, WARN, INFO (default), DEBUG, VERBOSE, VERY_VERBOSE
  log_level: "INFO"
  # DNS suffix appended to the hostname so the candle appears as
  # esp32-candle-XXXXXX.local (or .iot.home.lan, etc.)
  dns_domain: ".local"
  # Skip the Wi-Fi scan on reconnect for faster wake-up.
  wifi_fast_connect: "false"

  # GPIO pinout - override only if you have a hardware variant.
  led_pin:       GPIO33   # WS2812 data
  white1_pin:    GPIO15
  white2_pin:    GPIO16
  uv_pin:        GPIO17
  red_pin:       GPIO18
  i2c_sda_pin:   GPIO8
  i2c_scl_pin:   GPIO9
  button_pin:    GPIO0    # boot button

  # Power caps — white/red aligned with standalone src/config.h.
  # UV ceiling kept lower than the demo's 75%: 365nm looks very bright in a
  # tea-light and was harsh at the higher product preset levels.
  white_max_power: "40%"
  uv_max_power:    "40%"
  red_max_power:   "80%"

  # Persistence: which state lights/switches restore to after a power cut.
  # Options: ALWAYS_ON, ALWAYS_OFF, RESTORE_DEFAULT_ON, RESTORE_DEFAULT_OFF.
  light_restore_mode:  RESTORE_DEFAULT_OFF
  switch_restore_mode: RESTORE_DEFAULT_OFF

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  comment: "${device_description}"
  area: "${room}"
  # Append the last 3 bytes of the MAC to the hostname so multiple unflashed
  # candles do not collide on the network on first boot.
  name_add_mac_suffix: true
  min_version: 2026.6.0
  project:
    name: "${project_name}"
    version: "${project_version}"
  # Custom candle/color/magic effect engine (ported from src/main.cpp).
  # See esphome/includes/candle_effects.h.
  includes:
    - includes/candle_effects.h

# Custom ESP Candle PCB. ESPHome needs a board name from its built-in list;
# esp32-s3-devkitc1-n4r2 matches our SoC/memory (4MB flash, 2MB quad PSRAM).
# Pinout is candle-specific via substitutions — not DevKitC silkscreen.
# Standalone firmware uses the project-local boards/espcandle.json instead
# (same memory profile; see platformio.ini).
esp32:
  board: esp32-s3-devkitc1-n4r2
  framework:
    type: esp-idf

logger:
  level: ${log_level}

# Native Home Assistant API.
#
# No encryption key is baked into the firmware. The device starts with
# noise-protocol support compiled in but no PSK; on first connect,
# Home Assistant generates a per-device Noise PSK, sends it to the
# device via the noise_encryption_set_key RPC, and the device
# persists it in flash. Plaintext is disabled after that. This
# requires ESPHome >= 2025.10.0 and Home Assistant's ESPHome
# integration with aioesphomeapi >= 2025.10.0.
#
# To opt back into a baked-in static key (dev/CI path), set
# `api: encryption: key: !secret <name>_api_key` in a per-device
# YAML. See esphome/secrets-example.yaml.
api:
  encryption:

# OTA updates. Per-device password is set in the including YAML.
ota:
  - platform: esphome
    id: ota_esphome

# Wi-Fi: no SSID/password here on purpose.
#   - First boot: AP comes up, captive portal serves a setup page.
#   - improv-serial sets credentials over USB-CDC.
#   - esp32_improv sets credentials over BLE.
# Once provisioned, credentials are stored in flash and the AP stays off.
wifi:
  ap: {}
  fast_connect: "${wifi_fast_connect}"
  domain: "${dns_domain}"

captive_portal:

improv_serial:

esp32_improv:
  authorizer: none

mdns:
  disabled: false

# -- I2C bus (modder/expansion only) ----------------------------------------
# No I2C devices are configured by default. Uncomment to enable the bus
# for expansion sensors. See docs/modders.md.
#
# i2c:
#   sda: ${i2c_sda_pin}
#   scl: ${i2c_scl_pin}
#   scan: true

# -- PWM outputs ------------------------------------------------------------
# Owned exclusively by effects, Preset select, and channel number entities
# via set_level(). No monochromatic light wrappers (avoids dual writers).
output:
  - platform: ledc
    pin: ${white1_pin}
    id: pwm_led_1
    frequency: "5000Hz"
    max_power: ${white_max_power}
  - platform: ledc
    pin: ${white2_pin}
    id: pwm_led_2
    frequency: "5000Hz"
    max_power: ${white_max_power}
  - platform: ledc
    pin: ${uv_pin}
    id: pwm_led_3
    max_power: ${uv_max_power}
  - platform: ledc
    pin: ${red_pin}
    id: pwm_led_4
    max_power: ${red_max_power}

# Guard so channel number set_action / light on_turn_off do not fight Preset.
globals:
  - id: applying_preset
    type: bool
    restore_value: false
    initial_value: "false"

# -- Lights -----------------------------------------------------------------
# Primary HA light = RGB strip + master brightness for the whole candle.
# Presets are scenes: effect engine + default master %. Effects (including
# static Natural / Warm Glow / UV Accent) scale PWM by brightness×state;
# addressable RGB is scaled by ESPHome color correction the same way.
# Channel numbers (White/Red/UV): under static scenes they tweak mix in-place;
# under animated scenes they flip Preset to Custom. Light toggle = master off.
light:
  - platform: esp32_rmt_led_strip
    id: rgb_strip
    name: "ESP Candle"
    chipset: WS2812
    rgb_order: GRB
    pin: ${led_pin}
    num_leds: 20
    use_dma: true
    rmt_symbols: 1024
    use_psram: false
    restore_mode: ${light_restore_mode}
    default_transition_length: 0s
    gamma_correct: 1.0
    effects:
      - addressable_lambda:
          name: Warm Glow
          update_interval: 100ms
          lambda: |-
            espcandle::warm_glow::tick(it, initial_run);
      - addressable_lambda:
          name: Natural
          update_interval: 100ms
          lambda: |-
            espcandle::natural::tick(it, initial_run);
      - addressable_lambda:
          name: Ember
          update_interval: 50ms
          lambda: |-
            espcandle::ember::tick(it, initial_run);
      - addressable_lambda:
          name: UV Accent
          update_interval: 100ms
          lambda: |-
            espcandle::uv_accent::tick(it, initial_run);
      - addressable_lambda:
          name: Candle
          update_interval: 20ms
          lambda: |-
            espcandle::candle::tick(it, initial_run);
      - addressable_lambda:
          name: Color
          update_interval: 50ms
          lambda: |-
            espcandle::color::tick(it, initial_run);
      - addressable_lambda:
          name: Magic
          update_interval: 50ms
          lambda: |-
            espcandle::magic::tick(it, initial_run);
    on_turn_on:
      - lambda: |-
          // Skip while a Preset is driving the light (avoids re-entry / boot races).
          if (id(applying_preset))
            return;
          auto opt = id(candle_preset).current_option();
          if (opt.empty())
            return;

          // Custom: leave the user's RGB/effect/brightness alone.
          if (opt == "Custom")
            return;

          // Re-apply the current preset (restores its default master %).
          // Do not force brightness to 1.0 here — that caused the "shoots up" bug.
          id(applying_preset) = true;
          {
            auto blank = id(rgb_strip).turn_on();
            blank.set_effect("None");
            blank.set_rgb(0.0f, 0.0f, 0.0f);
            blank.perform();
          }
          id(applying_preset) = false;

          if (opt == "Off") {
            auto call = id(candle_preset).make_call();
            call.set_option("Candle");
            call.perform();
          } else {
            auto call = id(candle_preset).make_call();
            call.set_option(std::string(opt.c_str(), opt.size()));
            call.perform();
          }
    on_turn_off:
      # Skip when a Preset is applying (internal light calls during set_action).
      - if:
          condition:
            lambda: "return !id(applying_preset);"
          then:
            - lambda: |-
                id(pwm_led_1).set_level(0.0f);
                id(pwm_led_2).set_level(0.0f);
                id(pwm_led_3).set_level(0.0f);
                id(pwm_led_4).set_level(0.0f);
                id(applying_preset) = true;
                id(white_level).publish_state(0);
                id(red_level).publish_state(0);
                id(uv_level).publish_state(0);
                id(applying_preset) = false;
            - select.set:
                id: candle_preset
                option: "Off"
    on_state:
      # Custom mix: remaster PWM when HA brightness/on changes (effect is off).
      - lambda: |-
          if (id(applying_preset))
            return;
          if (id(candle_preset).current_option() != "Custom")
            return;
          espcandle::apply_custom_pwm();

# -- Presets ----------------------------------------------------------------
# Each producing preset is a scene: effect + default master brightness.
# Short-press cycles Warm Glow → Natural → Candle → Color → Magic.
select:
  - platform: template
    name: "Preset"
    id: candle_preset
    icon: mdi:candle
    optimistic: true
    restore_value: true
    initial_option: "Off"
    options:
      - "Off"
      - "Warm Glow"
      - "Natural"
      - "Ember"
      - "UV Accent"
      - "Candle"
      - "Color"
      - "Magic"
      - "Custom"
    set_action:
      - lambda: |-
          id(applying_preset) = true;
          auto sync_levels = [](float white_pct, float red_pct, float uv_pct) {
            id(white_level).publish_state(white_pct);
            id(red_level).publish_state(red_pct);
            id(uv_level).publish_state(uv_pct);
          };
          // Scene apply: turn on, set master brightness, start effect.
          // Effects scale all channels by brightness×state (master_level).
          auto soft_effect = [](const char *effect, float brightness) {
            auto rgb = id(rgb_strip).turn_on();
            rgb.set_rgb(0.0f, 0.0f, 0.0f);
            rgb.set_brightness(brightness);
            rgb.set_effect(effect);
            rgb.perform();
          };

          if (x == "Off") {
            id(pwm_led_1).set_level(0.0f);
            id(pwm_led_2).set_level(0.0f);
            id(pwm_led_3).set_level(0.0f);
            id(pwm_led_4).set_level(0.0f);
            sync_levels(0, 0, 0);
            id(rgb_strip).turn_off().perform();
          } else if (x == "Warm Glow") {
            // Mix shown as % of channel at master=100%; default master 60%.
            sync_levels(10, 40, 0);
            soft_effect("Warm Glow", 0.60f);
          } else if (x == "Natural") {
            // White mix 100% × master 50% → 50% whites; RGB warm tint ~30%.
            sync_levels(100, 0, 0);
            soft_effect("Natural", 0.50f);
          } else if (x == "Ember") {
            sync_levels(2, 10, 0);
            soft_effect("Ember", 0.45f);
          } else if (x == "UV Accent") {
            sync_levels(0, 0, 50);
            soft_effect("UV Accent", 0.40f);
          } else if (x == "Candle") {
            sync_levels(0, 0, 0);  // effect owns PWM
            soft_effect("Candle", 0.40f);
          } else if (x == "Color") {
            sync_levels(0, 0, 0);
            soft_effect("Color", 0.50f);
          } else if (x == "Magic") {
            sync_levels(0, 0, 0);
            soft_effect("Magic", 0.45f);
          } else if (x == "Custom") {
            // Manual mix: stop scene effect so channel sliders own PWM;
            // keep current brightness; remaster PWM from number states.
            auto rgb = id(rgb_strip).turn_on();
            rgb.set_effect("None");
            rgb.perform();
            espcandle::apply_custom_pwm();
          }
          id(applying_preset) = false;

# -- Channel levels (HA Configuration section) ------------------------------
# Mix controls. Static scenes (Warm Glow / Natural / UV Accent) keep the
# preset and feed mix into the effect — master / RGB scene tint stay put.
# Animated scenes (Candle / Color / Magic / Ember) flip to Custom.
number:
  - platform: template
    name: "White Brightness"
    id: white_level
    icon: mdi:lightbulb-outline
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true
    set_action:
      - lambda: |-
          auto preset = std::string(id(candle_preset).current_option().c_str());
          if (!id(applying_preset) && espcandle::is_animated_preset(preset)) {
            auto call = id(candle_preset).make_call();
            call.set_option("Custom");
            call.perform();
          }
          // Static scenes: effect tick applies mix × master. Custom: write now.
          if (id(candle_preset).current_option() == "Custom")
            espcandle::apply_custom_pwm();

  - platform: template
    name: "Red Intensity"
    id: red_level
    icon: mdi:circle
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true
    set_action:
      - lambda: |-
          auto preset = std::string(id(candle_preset).current_option().c_str());
          if (!id(applying_preset) && espcandle::is_animated_preset(preset)) {
            auto call = id(candle_preset).make_call();
            call.set_option("Custom");
            call.perform();
          }
          if (id(candle_preset).current_option() == "Custom")
            espcandle::apply_custom_pwm();

  - platform: template
    name: "UV Intensity"
    id: uv_level
    icon: mdi:weather-night
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true
    set_action:
      - lambda: |-
          auto preset = std::string(id(candle_preset).current_option().c_str());
          if (!id(applying_preset) && espcandle::is_animated_preset(preset)) {
            auto call = id(candle_preset).make_call();
            call.set_option("Custom");
            call.perform();
          }
          if (id(candle_preset).current_option() == "Custom")
            espcandle::apply_custom_pwm();

# -- Boot button ------------------------------------------------------------
binary_sensor:
  - platform: status
    name: "Status"
    id: status_sensor
    entity_category: diagnostic
    disabled_by_default: true

  - platform: gpio
    pin:
      number: ${button_pin}
      mode: INPUT_PULLUP
      inverted: true
    name: "Boot Button"
    id: boot_button
    entity_category: diagnostic
    disabled_by_default: true
    filters:
      - delayed_on_off: 20ms
    on_multi_click:
      # Short press: cycle Warm Glow → Natural → Candle → Color → Magic → …
      - timing:
          - ON for at most 1s
          - OFF for at least 0.2s
        then:
          - lambda: |-
              static const char *cycle[] = {"Warm Glow", "Natural", "Candle", "Color", "Magic"};
              constexpr int n = 5;
              auto cur = id(candle_preset).current_option();
              int next = 0;
              for (int i = 0; i < n; i++) {
                if (cur == cycle[i]) {
                  next = (i + 1) % n;
                  break;
                }
              }
              auto call = id(candle_preset).make_call();
              call.set_option(cycle[next]);
              call.perform();
      # Long press (3–10s, then release): toggle RGB on/off.
      # Requires release so a 10s factory-reset hold does not also toggle.
      - timing:
          - ON for 3s to 10s
          - OFF for at least 0.1s
        then:
          - light.toggle: rgb_strip
      # Hold 10s: factory reset (wipe Wi-Fi / API key, re-enter provisioning)
      - timing:
          - ON for at least 10s
        then:
          - button.press: factory_reset_button

# -- Extra GPIOs as switches (modder/expansion only) -----------------------
# These GPIO10/11/12 pins are exposed as switches for tinkerers. On some
# ESP32-S3 modules these may be strapping or SPI/flash pins - verify your
# board before enabling. Commented out by default. See docs/modders.md.
#
# switch:
#   - platform: gpio
#     pin: GPIO10
#     name: "Extra GPIO 10"
#     id: extra_gpio_10
#     restore_mode: ${switch_restore_mode}
#   - platform: gpio
#     pin: GPIO11
#     name: "Extra GPIO 11"
#     id: extra_gpio_11
#     restore_mode: ${switch_restore_mode}
#   - platform: gpio
#     pin: GPIO12
#     name: "Extra GPIO 12"
#     id: extra_gpio_12
#     restore_mode: ${switch_restore_mode}

# -- Buttons (HA-side recovery) ---------------------------------------------
button:
  - platform: restart
    name: "Restart"
    id: restart_button
    entity_category: config
  - platform: factory_reset
    name: "Factory Reset"
    id: factory_reset_button
    entity_category: config
  - platform: safe_mode
    name: "Safe Mode"
    id: safe_mode_button
    entity_category: config

# -- Diagnostics ------------------------------------------------------------
sensor:
  - platform: internal_temperature
    name: "Internal Temperature"
    id: chip_temperature
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    entity_category: diagnostic
    disabled_by_default: true

  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: diagnostic
    disabled_by_default: true

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip_address
      entity_category: diagnostic
      disabled_by_default: true
    ssid:
      name: "Connected SSID"
      id: wifi_ssid
      entity_category: diagnostic
      disabled_by_default: true
    mac_address:
      name: "MAC Address"
      id: wifi_mac_address
      entity_category: diagnostic
      disabled_by_default: true

  - platform: version
    name: "ESPHome Version"
    id: esphome_version
    entity_category: diagnostic
    disabled_by_default: true

# -- Optional components (modder/expansion) ---------------------------------
# Uncomment to enable. See docs/modders.md for details and tradeoffs.
#
# Local web UI on http://<device>.local for status and manual control.
# Note: unauthenticated on a trusted LAN by default; add `auth:` for a password.
#
# web_server:
#   port: 80
#   # auth:
#   #   username: !secret web_username
#   #   password: !secret web_password
#
# SNTP time sync + "Last Restart" text sensor. Adds a time component and a
# template automation; not needed for onboarding or light control (HA tracks
# device availability on its own).
#
# time:
#   - platform: sntp
#     id: sntp_time
#     timezone: "Europe/Zurich"   # or add a timezone: substitution above
#     servers:
#       - "0.pool.ntp.org"
#       - "1.pool.ntp.org"
#       - "2.pool.ntp.org"
#     on_time_sync:
#       then:
#         - text_sensor.template.publish:
#             id: device_last_restart
#             state: !lambda 'return id(sntp_time).now().strftime("%a %d %b %Y - %H:%M:%S");'
#
# text_sensor:
#   - platform: template
#     name: "Last Restart"
#     id: device_last_restart
#     entity_category: diagnostic
