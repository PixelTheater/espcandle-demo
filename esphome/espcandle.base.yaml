#     id: extra_gpio_10
#     restore_mode: ${switch_restore_mode}
#   - platform: gpio
#     pin: GPIO11
#     name: "Extra GPIO 11"
#     id: extra_gpio_11
#     restore_mode: ${switch_restore_mode}
#   - platform: gpio
#     pin: GPIO12
#     name: "Extra GPIO 12"
#     id: extra_gpio_12
