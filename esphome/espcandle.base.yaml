# -- Buttons (HA-side recovery) ---------------------------------------------
button:
  - platform: restart
    name: "Restart"
    id: restart_button
    entity_category: config
  - platform: factory_reset
    name: "Factory Reset"
    id: factory_reset_button
    entity_category: config
  - platform: safe_mode
    name: "Safe Mode"
    id: safe_mode_button
    entity_category: config

# -- Diagnostics ------------------------------------------------------------
sensor:
  - platform: internal_temperature
    name: "Internal Temperature"
    id: chip_temperature
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    entity_category: diagnostic
    disabled_by_default: true

  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: diagnostic
    disabled_by_default: true

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip_address
      entity_category: diagnostic
      disabled_by_default: true
    ssid:
      name: "Connected SSID"
      id: wifi_ssid
      entity_category: diagnostic
      disabled_by_default: true
    mac_address:
      name: "MAC Address"
      id: wifi_mac_address
      entity_category: diagnostic
      disabled_by_default: true

  - platform: version
    name: "ESPHome Version"
    id: esphome_version
    entity_category: diagnostic
    disabled_by_default: true

