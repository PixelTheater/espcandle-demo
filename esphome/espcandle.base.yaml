# ESP Candle - shared base configuration.
#
# This file defines all hardware, provisioning, and diagnostic entities for
# the ESP Candle PCB (see project README for hardware details). It is meant
# to be included as a package from a small per-device YAML, e.g.:
#
#   substitutions:
#     name: esp32-candle-livingroom
#     friendly_name: Living Room Candle
#   packages:
#     espcandle: !include espcandle.base.yaml
#
# Or remotely:
#
#   packages:
#     espcandle: github://PixelTheater/espcandle-demo/esphome/espcandle.base.yaml@main
#
# Out of the box, a freshly flashed candle:
#   - comes up as a Wi-Fi AP with a captive portal
#   - accepts Wi-Fi credentials over USB-CDC (improv-serial) and BLE (esp32_improv)
#   - is discovered by Home Assistant via the native API once on Wi-Fi
#   - accepts OTA updates from Home Assistant or the ESPHome CLI
#
# Only ONE light is exposed to Home Assistant by default: "ESP Candle", a
# partition light that joins the addressable RGB strip and the four PWM
# channels (warm white 1/2, UV, deep red) into a single logical light with
# curated effects (Candle / Color / Magic). The underlying channel lights
# are kept internal so they do not clutter the HA UI. Modders who want
# direct per-channel control should see docs/modders.md.

substitutions:
  name: esp32-candle
  friendly_name: ESP Candle
  room: ""
  device_description: "ESP32-S3 powered smart tea candle (RGB + warm white + UV + deep red)"
  project_name: "PixelTheater.ESP Candle"
  project_version: "1.5.0"

  # Logging level: NONE, ERROR, WARN, INFO (default), DEBUG, VERBOSE, VERY_VERBOSE
  log_level: "INFO"
  # DNS suffix appended to the hostname so the candle appears as
  # esp32-candle-XXXXXX.local (or .iot.home.lan, etc.)
  dns_domain: ".local"
  # Skip the Wi-Fi scan on reconnect for faster wake-up.
  wifi_fast_connect: "false"

  # GPIO pinout - override only if you have a hardware variant.
  led_pin:       GPIO33   # WS2812 data
  white1_pin:    GPIO15
  white2_pin:    GPIO16
  uv_pin:        GPIO17
  red_pin:       GPIO18
  i2c_sda_pin:   GPIO8
  i2c_scl_pin:   GPIO9
  button_pin:    GPIO0    # boot button

  # Power caps - protect LEDs and the supply.
  white_max_power: "70%"
  uv_max_power:    "50%"

  # Persistence: which state lights/switches restore to after a power cut.
  # Options: ALWAYS_ON, ALWAYS_OFF, RESTORE_DEFAULT_ON, RESTORE_DEFAULT_OFF.
  light_restore_mode:  RESTORE_DEFAULT_OFF
  switch_restore_mode: RESTORE_DEFAULT_OFF

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  comment: "${device_description}"
  area: "${room}"
  # Append the last 3 bytes of the MAC to the hostname so multiple unflashed
  # candles do not collide on the network on first boot.
  name_add_mac_suffix: true
  min_version: 2025.10.0
  project:
    name: "${project_name}"
    version: "${project_version}"
  # Cycles the candle effect on each short button press. The light.effect.next
  # action (ESPHome >= 2026.6.0) is not available in the 2025.10/2025.12 line
  # this firmware pins, so we track the index here and apply it via
  # light.turn_on { effect: <name> }.
  on_boot:
    priority: -100
    then:
      - globals.set:
          id: effect_index
          value: '0'

esp32:
  board: adafruit_feather_esp32s3
  framework:
    type: esp-idf

logger:
  level: ${log_level}

# Effect-cycle index for the boot button (see on_multi_click). Three effects:
# Candle(0) / Color(1) / Magic(2).
globals:
  - id: effect_index
    type: int
    initial_value: '0'

# Native Home Assistant API.
#
# No encryption key is baked into the firmware. The device starts with
# noise-protocol support compiled in but no PSK; on first connect,
# Home Assistant generates a per-device Noise PSK, sends it to the
# device via the noise_encryption_set_key RPC, and the device
# persists it in flash. Plaintext is disabled after that. This
# requires ESPHome >= 2025.10.0 and Home Assistant's ESPHome
# integration with aioesphomeapi >= 2025.10.0.
#
# To opt back into a baked-in static key (dev/CI path), set
# `api: encryption: key: !secret <name>_api_key` in a per-device
# YAML. See esphome/secrets-example.yaml.
api:
  encryption:

# OTA updates. Per-device password is set in the including YAML.
ota:
  - platform: esphome

# Wi-Fi: no SSID/password here on purpose.
#   - First boot: AP comes up, captive portal serves a setup page.
#   - improv-serial sets credentials over USB-CDC.
#   - esp32_improv sets credentials over BLE.
# Once provisioned, credentials are stored in flash and the AP stays off.
wifi:
  ap: {}
  fast_connect: "${wifi_fast_connect}"
  domain: "${dns_domain}"

captive_portal:

improv_serial:

esp32_improv:
  authorizer: none

mdns:
  disabled: false

# -- I2C bus (modder/expansion only) ----------------------------------------
# No I2C devices are configured by default. Uncomment to enable the bus
# for expansion sensors. See docs/modders.md.
#
# i2c:
#   sda: ${i2c_sda_pin}
#   scl: ${i2c_scl_pin}
#   scan: true

# -- PWM outputs ------------------------------------------------------------
output:
  - platform: ledc
    pin: ${white1_pin}
    id: pwm_led_1
    frequency: "300Hz"
    max_power: ${white_max_power}
  - platform: ledc
    pin: ${white2_pin}
    id: pwm_led_2
    frequency: "300Hz"
    max_power: ${white_max_power}
  - platform: ledc
    pin: ${uv_pin}
    id: pwm_led_3
    max_power: ${uv_max_power}
  - platform: ledc
    pin: ${red_pin}
    id: pwm_led_4

# -- Lights -----------------------------------------------------------------
# default_transition_length and gamma_correct settings come from the
# ESPHome+addressable-LED best practices: pixel-mapped strips look wrong
# with the defaults (1000ms transitions, 2.8 gamma).
#
# The five underlying channel lights are internal: they drive the hardware but
# are not exposed to Home Assistant. The single visible light is the
# "ESP Candle" partition below, which joins them into one logical light.
light:
  - platform: esp32_rmt_led_strip
    id: rgb_strip
    chipset: WS2812
    rgb_order: GRB
    pin: ${led_pin}
    num_leds: 20
    use_dma: true
    rmt_symbols: 1024
    use_psram: false
    internal: true
    restore_mode: ${light_restore_mode}
    default_transition_length: 0s
    gamma_correct: 1.0

  - platform: monochromatic
    id: white_1
    output: pwm_led_1
    internal: true
    restore_mode: ${light_restore_mode}
    default_transition_length: 250ms

  - platform: monochromatic
    id: white_2
    output: pwm_led_2
    internal: true
    restore_mode: ${light_restore_mode}
    default_transition_length: 250ms

  - platform: monochromatic
    id: uv_led
    output: pwm_led_3
    internal: true
    restore_mode: ${light_restore_mode}
    default_transition_length: 250ms

  - platform: monochromatic
    id: red_led
    output: pwm_led_4
    internal: true
    restore_mode: ${light_restore_mode}
    default_transition_length: 250ms

  # The single user-facing light. Joins the addressable RGB strip and the
  # four PWM channels (warm white 1/2, UV, deep red) into one logical light.
  # Effects are named to mirror the standalone firmware modes (Candle /
  # Color / Magic). The boot button cycles these effects (short press) and
  # toggles the light on/off (long press).
  - platform: partition
    id: candle_light
    name: "ESP Candle"
    restore_mode: ${light_restore_mode}
    default_transition_length: 0s
    gamma_correct: 1.0
    segments:
      - id: rgb_strip
        from: 0
        to: 19
      - single_light_id: white_1
      - single_light_id: white_2
      - single_light_id: red_led
      - single_light_id: uv_led
    effects:
      # Candle - warm flicker across the whites and red, calm base on RGB.
      - flicker:
          name: Candle
          alpha: 95%
          intensity: 1.5%
      # Color - slow hue sweep across the RGB strip.
      - addressable_rainbow:
          name: Color
          speed: 3
          width: 80
      # Magic - purple/blue twinkle across the strip with UV accent.
      - addressable_twinkle:
          name: Magic
          twinkle_probability: 5%
          progress_interval: 40ms

# -- Boot button ------------------------------------------------------------
binary_sensor:
  - platform: status
    name: "Status"
    entity_category: diagnostic
    disabled_by_default: true

  - platform: gpio
    pin:
      number: ${button_pin}
      mode: INPUT_PULLUP
      inverted: true
    name: "Boot Button"
    id: boot_button
    entity_category: diagnostic
    disabled_by_default: true
    on_multi_click:
      # Short press: cycle to the next effect (Candle -> Color -> Magic -> Candle -> ...)
      # Uses a globals counter + light.turn_on { effect: ... } because the
      # light.effect.next action requires ESPHome >= 2026.6.0 and this firmware
      # pins the 2025.10/2025.12 line.
      - timing:
          - ON for at most 1s
          - OFF for at least 0.2s
        then:
          - lambda: |
              static const char *const effects[] = {"Candle", "Color", "Magic"};
              constexpr int n = 3;
              int idx = id(effect_index);
              idx = (idx + 1) % n;
              id(effect_index) = idx;
              id(candle_light).turn_on().set_effect(effects[idx]).perform();
      # Long press (>3s): toggle the candle on/off
      - timing:
          - ON for at least 3s
        then:
          - light.toggle: candle_light

# -- Extra GPIOs as switches (modder/expansion only) -----------------------
# These GPIO10/11/12 pins are exposed as switches for tinkerers. On some
# ESP32-S3 modules these may be strapping or SPI/flash pins - verify your
# board before enabling. Commented out by default. See docs/modders.md.
#
# switch:
#   - platform: gpio
#     pin: GPIO10
#     name: "Extra GPIO 10"
#     id: extra_gpio_10
#     restore_mode: ${switch_restore_mode}
#   - platform: gpio
#     pin: GPIO11
#     name: "Extra GPIO 11"
#     id: extra_gpio_11
#     restore_mode: ${switch_restore_mode}
#   - platform: gpio
#     pin: GPIO12
#     name: "Extra GPIO 12"
#     id: extra_gpio_12
#     restore_mode: ${switch_restore_mode}

# -- Buttons (HA-side recovery) ---------------------------------------------
button:
  - platform: restart
    name: "Restart"
    id: restart_button
    entity_category: config
  - platform: factory_reset
    name: "Factory Reset"
    id: factory_reset_button
    entity_category: config
  - platform: safe_mode
    name: "Safe Mode"
    entity_category: config

# -- Diagnostics ------------------------------------------------------------
# Sensors report to Home Assistant but the noisy ones are hidden by default
# to keep the device UI clean. Enable them in HA if needed for support.
sensor:
  - platform: internal_temperature
    name: "Internal Temperature"
    entity_category: diagnostic
    disabled_by_default: true

  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    entity_category: diagnostic
    disabled_by_default: true

  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: diagnostic
    disabled_by_default: true

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
      disabled_by_default: true
    ssid:
      name: "Connected SSID"
      entity_category: diagnostic
      disabled_by_default: true
    mac_address:
      name: "MAC Address"
      entity_category: diagnostic
      disabled_by_default: true

  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic
    disabled_by_default: true

# -- Optional components (modder/expansion) ---------------------------------
# Uncomment to enable. See docs/modders.md for details and tradeoffs.
#
# Local web UI on http://<device>.local for status and manual control.
# Note: unauthenticated on a trusted LAN by default; add `auth:` for a password.
#
# web_server:
#   port: 80
#   # auth:
#   #   username: !secret web_username
#   #   password: !secret web_password
#
# SNTP time sync + "Last Restart" text sensor. Adds a time component and a
# template automation; not needed for onboarding or light control (HA tracks
# device availability on its own).
#
# time:
#   - platform: sntp
#     id: sntp_time
#     timezone: "${timezone}"
#     servers:
#       - "0.pool.ntp.org"
#       - "1.pool.ntp.org"
#       - "2.pool.ntp.org"
#     on_time_sync:
#       then:
#         - text_sensor.template.publish:
#             id: device_last_restart
#             state: !lambda 'return id(sntp_time).now().strftime("%a %d %b %Y - %H:%M:%S");'
#
# text_sensor:
#   - platform: template
#     name: "Last Restart"
#     id: device_last_restart
#     entity_category: diagnostic
