# ESP Candle - shared base configuration.
#
# This file defines all hardware, provisioning, and diagnostic entities for
# the ESP Candle PCB (see project README for hardware details). It is meant
# to be included as a package from a small per-device YAML, e.g.:
#
#   substitutions:
#     name: esp32-candle-livingroom
#     friendly_name: Living Room Candle
#   packages:
#     espcandle: !include espcandle.base.yaml
#
# Or remotely:
#
#   packages:
#     espcandle: github://PixelTheater/espcandle-demo/esphome/espcandle.base.yaml@main
#
# Out of the box, a freshly flashed candle:
#   - comes up as a Wi-Fi AP with a captive portal
#   - accepts Wi-Fi credentials over USB-CDC (improv-serial) and BLE (esp32_improv)
#   - is discovered by Home Assistant via the native API once on Wi-Fi
#   - accepts OTA updates from Home Assistant or the ESPHome CLI
#
# HA entities: "ESP Candle" light (scene master in presets; RGB strip in Custom),
# Preset select, White/Red/UV level numbers + enable switches, and RGB Strip
# enable. Scenes own all outputs; any channel change enters Custom. PWM channels
# are driven via ledc.set_level(). Boot is always Preset Off (all outputs dark).
# A Top Board select (config) sets how the whites are driven for the LED board
# fitted (v1.3, v1.4, v1.6); it is stored across reboots and updates.
# See docs/modders.md.

substitutions:
  name: esp32-candle
  friendly_name: ESP Candle
  room: ""
  device_description: "ESP32-S3 powered smart tea candle (RGB + warm white + UV + deep red)"
  project_name: "PixelTheater.ESP Candle"
  project_version: "0.5.0"

  # Logging level: NONE, ERROR, WARN, INFO (default), DEBUG, VERBOSE, VERY_VERBOSE
  log_level: "INFO"
  # DNS suffix appended to the hostname so the candle appears as
  # esp32-candle-XXXXXX.local (or .iot.home.lan, etc.)
  dns_domain: ".local"
  # Skip the Wi-Fi scan on reconnect for faster wake-up.
  wifi_fast_connect: "false"

  # GPIO pinout - override only if you have a hardware variant.
  led_pin:       GPIO33   # WS2812 data
  white1_pin:    GPIO15
  white2_pin:    GPIO16
  uv_pin:        GPIO17
  red_pin:       GPIO18
  i2c_sda_pin:   GPIO8
  i2c_scl_pin:   GPIO9
  button_pin:    GPIO0    # boot button

  # Top board: the LED board on top of the stack (its version is on the silk).
  # It sets how the two warm whites are driven; the base boards (v1.3, v1.3.1,
  # v1.6) need no setting. The Top Board select in Home Assistant stores the
  # choice; this is its default on a freshly flashed candle. v1.4 is the safe
  # default: a v1.6 top is only dimmer with it, while v1.6 settings on a v1.4
  # top drive its whites at their full 88 mA.
  top_board: "v1.4"

  # White channel per top board: PWM frequency (Hz), min power and max power
  # (fractions of full duty). Level 0 is always off; any level above 0 starts
  # at min power, which skips a driver's dead zone. The max powers give about
  # the same white at 100 % on every top, so scenes look alike on all of them.
  #   v1.3: PAM2804 buck at 100 mA (1 ohm sense). Lights from about 20 % duty
  #         at 500 Hz (bench, 2026-02); faster PWM leaves it dark.
  #   v1.4: BCR421U linear driver at about 88 mA (REXT 10 ohm); 40 % cap.
  #   v1.6: BCR421U at about 50 mA (REXT 20 ohm), 2700 K CRI 97 LEDs with
  #         about 0.7x the light per mA: 100 % is about v1.4's 40 %. 4 kHz
  #         keeps 14-bit PWM (5 kHz drops to 13) for finer low-end steps.
  white_v13_frequency: "500"
  white_v13_min_power: "0.20"
  white_v13_max_power: "0.50"
  white_v14_frequency: "5000"
  white_v14_min_power: "0.0"
  white_v14_max_power: "0.40"
  white_v16_frequency: "4000"
  white_v16_min_power: "0.0"
  white_v16_max_power: "1.0"

  # UV and red caps (the same circuits on every top). UV ceiling kept lower
  # than the standalone demo's 75%: 365nm looks very bright in a tea-light and
  # was harsh at the higher product preset levels.
  uv_max_power:    "40%"
  red_max_power:   "80%"

  # Boot is always dark. Restoring a high PWM scene after a brownout would
  # reboot-loop. Options: ALWAYS_ON, ALWAYS_OFF, RESTORE_DEFAULT_ON,
  # RESTORE_DEFAULT_OFF. Override in a per-device YAML only if you accept that.
  light_restore_mode:  ALWAYS_OFF
  switch_restore_mode: ALWAYS_OFF

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  comment: "${device_description}"
  area: "${room}"
  # Append the last 3 bytes of the MAC to the hostname so multiple unflashed
  # candles do not collide on the network on first boot.
  name_add_mac_suffix: true
  min_version: 2026.6.0
  project:
    name: "${project_name}"
    version: "${project_version}"
  # Custom candle/color/magic effect engine (ported from src/main.cpp).
  # See esphome/includes/candle_effects.h.
  includes:
    - includes/candle_effects.h
  on_boot:
    # After LEDC exists: force PWM off before Wi-Fi/BLE load, so a previous
    # high-power state cannot brownout-loop. Late trigger forces Preset Off
    # if a restore race left Custom/a scene selected.
    # Then apply the stored Top Board (LEDC and the select are both set up by
    # now), before anything can light.
    - priority: 600
      then:
        - lambda: |-
            id(pwm_led_1).set_level(0.0f);
            id(pwm_led_2).set_level(0.0f);
            id(pwm_led_3).set_level(0.0f);
            id(pwm_led_4).set_level(0.0f);
        - script.execute:
            id: apply_top_board
            index: !lambda "return id(top_board).active_index().value_or(1);"
        - globals.set:
            id: top_board_ready
            value: "true"
    - priority: -100
      then:
        - lambda: |-
            if (id(candle_preset).current_option() != "Off") {
              auto call = id(candle_preset).make_call();
              call.set_option("Off");
              call.perform();
            }

# Custom ESP Candle PCB. ESPHome needs a board name from its built-in list;
# esp32-s3-devkitc1-n4r2 matches our SoC/memory (4MB flash, 2MB quad PSRAM).
# Pinout is candle-specific via substitutions — not DevKitC silkscreen.
# Standalone firmware uses the project-local boards/espcandle.json instead
# (same memory profile; see platformio.ini).
esp32:
  board: esp32-s3-devkitc1-n4r2
  framework:
    type: esp-idf

logger:
  level: ${log_level}

# Native Home Assistant API.
#
# No encryption key is baked into the firmware. The device starts with
# noise-protocol support compiled in but no PSK; on first connect,
# Home Assistant generates a per-device Noise PSK, sends it to the
# device via the noise_encryption_set_key RPC, and the device
# persists it in flash. Plaintext is disabled after that. This
# requires ESPHome >= 2025.10.0 and Home Assistant's ESPHome
# integration with aioesphomeapi >= 2025.10.0.
#
# To opt back into a baked-in static key (dev/CI path), set
# `api: encryption: key: !secret <name>_api_key` in a per-device
# YAML. See esphome/secrets-example.yaml.
api:
  encryption:

# OTA updates. Per-device password is set in the including YAML.
ota:
  - platform: esphome
    id: ota_esphome

# Wi-Fi: no SSID/password here on purpose.
#   - First boot: AP comes up, captive portal serves a setup page.
#   - improv-serial sets credentials over USB-CDC.
#   - esp32_improv sets credentials over BLE.
# Once provisioned, credentials are stored in flash and the AP stays off.
wifi:
  ap: {}
  fast_connect: "${wifi_fast_connect}"
  domain: "${dns_domain}"

captive_portal:

improv_serial:

esp32_improv:
  authorizer: none

mdns:
  disabled: false

# -- I2C bus (modder/expansion only) ----------------------------------------
# No I2C devices are configured by default. Uncomment to enable the bus
# for expansion sensors. See docs/modders.md.
#
# i2c:
#   sda: ${i2c_sda_pin}
#   scl: ${i2c_scl_pin}
#   scan: true

# -- PWM outputs ------------------------------------------------------------
# Owned exclusively by effects, Preset select, and channel number entities
# via set_level(). No monochromatic light wrappers (avoids dual writers).
#
# LEDC channels share a timer in pairs (0+1, 2+3), so the whites sit on 0 and
# 1, alone on their timer: the Top Board profile changes their frequency
# without touching UV and red. The white frequency and limits below are v1.4's
# and only hold until on_boot applies the stored Top Board.
output:
  - platform: ledc
    pin: ${white1_pin}
    id: pwm_led_1
    channel: 0
    frequency: "${white_v14_frequency}Hz"
    max_power: ${white_v14_max_power}
    zero_means_zero: true
  - platform: ledc
    pin: ${white2_pin}
    id: pwm_led_2
    channel: 1
    frequency: "${white_v14_frequency}Hz"
    max_power: ${white_v14_max_power}
    zero_means_zero: true
  - platform: ledc
    pin: ${uv_pin}
    id: pwm_led_3
    channel: 2
    max_power: ${uv_max_power}
  - platform: ledc
    pin: ${red_pin}
    id: pwm_led_4
    channel: 3
    max_power: ${red_max_power}

# Guard so channel number set_action / light on_turn_off do not fight Preset.
globals:
  - id: applying_preset
    type: bool
    restore_value: false
    initial_value: "false"
  # Set once on_boot has applied the stored Top Board; later changes to the
  # select apply at once (the restore during setup is left to on_boot).
  - id: top_board_ready
    type: bool
    restore_value: false
    initial_value: "false"

# Top Board profile: white PWM frequency and limits for the select's index
# (0 = v1.3, 1 = v1.4, 2 = v1.6). Re-applies Custom levels so a change shows
# at once; scenes rewrite PWM on their next tick.
script:
  - id: apply_top_board
    parameters:
      index: int
    then:
      - lambda: |-
          float hz, lo, hi;
          const char *top;
          switch (index) {
            case 0:
              top = "v1.3";
              hz = ${white_v13_frequency}; lo = ${white_v13_min_power}; hi = ${white_v13_max_power};
              break;
            case 2:
              top = "v1.6";
              hz = ${white_v16_frequency}; lo = ${white_v16_min_power}; hi = ${white_v16_max_power};
              break;
            default:
              top = "v1.4";
              hz = ${white_v14_frequency}; lo = ${white_v14_min_power}; hi = ${white_v14_max_power};
              break;
          }
          espcandle::apply_white_profile(hz, lo, hi);
          ESP_LOGI("espcandle", "Top board %s: white PWM %.0f Hz, %.0f-%.0f %% duty", top, hz,
                   lo * 100.0f, hi * 100.0f);
          if (espcandle::is_custom_mode())
            espcandle::apply_custom_pwm();

# -- Lights -----------------------------------------------------------------
# Primary HA light = RGB strip. In a scene preset, its brightness is the scene
# master (effects scale PWM by brightness×state; addressable RGB via color
# correction). In Custom, on/off + colour + brightness drive the strip only
# (gated by RGB Strip). Light off in Custom turns off RGB; from a scene it
# extinguishes everything and selects Preset Off.
light:
  - platform: esp32_rmt_led_strip
    id: rgb_strip
    name: "ESP Candle"
    chipset: WS2812
    rgb_order: GRB
    pin: ${led_pin}
    num_leds: 20
    use_dma: true
    rmt_symbols: 1024
    use_psram: false
    restore_mode: ${light_restore_mode}
    default_transition_length: 0s
    gamma_correct: 1.0
    effects:
      - addressable_lambda:
          name: Warm Glow
          update_interval: 100ms
          lambda: |-
            espcandle::warm_glow::tick(it, initial_run);
      - addressable_lambda:
          name: Natural
          update_interval: 100ms
          lambda: |-
            espcandle::natural::tick(it, initial_run);
      - addressable_lambda:
          name: Ember
          update_interval: 50ms
          lambda: |-
            espcandle::ember::tick(it, initial_run);
      - addressable_lambda:
          name: UV Accent
          update_interval: 100ms
          lambda: |-
            espcandle::uv_accent::tick(it, initial_run);
      - addressable_lambda:
          name: Candle
          update_interval: 20ms
          lambda: |-
            espcandle::candle::tick(it, initial_run);
      - addressable_lambda:
          name: Wifi RSSI
          update_interval: 50ms
          lambda: |-
            espcandle::wifi_rssi::tick(it, initial_run);
      - addressable_lambda:
          name: Color
          update_interval: 50ms
          lambda: |-
            espcandle::color::tick(it, initial_run);
      - addressable_lambda:
          name: Magic
          update_interval: 50ms
          lambda: |-
            espcandle::magic::tick(it, initial_run);
    on_turn_on:
      - lambda: |-
          // Skip while a Preset is driving the light (avoids re-entry / boot races).
          if (id(applying_preset))
            return;
          auto opt = id(candle_preset).current_option();
          if (opt.empty())
            return;

          // Custom: RGB light is independent — on/off/color/brightness only
          // affect the strip. Do not re-apply a scene or touch PWM.
          if (opt == "Custom") {
            id(rgb_enable).publish_state(true);
            return;
          }

          // Off + power on → Custom (manual). PWM stays at slider/enable state.
          if (opt == "Off") {
            id(rgb_enable).publish_state(true);
            auto call = id(candle_preset).make_call();
            call.set_option("Custom");
            call.perform();
            return;
          }

          // Re-apply the current scene preset.
          id(applying_preset) = true;
          {
            auto blank = id(rgb_strip).turn_on();
            blank.set_effect("None");
            blank.set_rgb(0.0f, 0.0f, 0.0f);
            blank.perform();
          }
          id(applying_preset) = false;
          {
            auto call = id(candle_preset).make_call();
            call.set_option(std::string(opt.c_str(), opt.size()));
            call.perform();
          }
    on_turn_off:
      # Scene modes: extinguish everything and select Off.
      # Custom: RGB light off only — White/Red/UV keep their levels.
      - if:
          condition:
            lambda: "return !id(applying_preset);"
          then:
            - lambda: |-
                auto opt = id(candle_preset).current_option();
                if (opt == "Custom") {
                  id(rgb_enable).publish_state(false);
                  return;
                }
                id(pwm_led_1).set_level(0.0f);
                id(pwm_led_2).set_level(0.0f);
                id(pwm_led_3).set_level(0.0f);
                id(pwm_led_4).set_level(0.0f);
                id(applying_preset) = true;
                id(white_level).publish_state(0);
                id(red_level).publish_state(0);
                id(uv_level).publish_state(0);
                id(white_enable).publish_state(false);
                id(red_enable).publish_state(false);
                id(uv_enable).publish_state(false);
                id(rgb_enable).publish_state(false);
                id(applying_preset) = false;
            - if:
                condition:
                  lambda: "return id(candle_preset).current_option() != \"Custom\";"
                then:
                  - select.set:
                      id: candle_preset
                      option: "Off"
    on_state:
      # Custom: never force colour to black (that made the picker look dead).
      # If RGB Strip is off, keep the light entity off so WS2812s stay dark while
      # colour/brightness are preserved for the next turn-on.
      - lambda: |-
          if (id(applying_preset))
            return;
          if (id(candle_preset).current_option() != "Custom")
            return;
          if (!id(rgb_enable).state && id(rgb_strip).current_values.get_state()) {
            id(applying_preset) = true;
            id(rgb_strip).turn_off().perform();
            id(applying_preset) = false;
          }

# -- Presets ----------------------------------------------------------------
# Each producing preset is a scene: effect + default master brightness.
# Short-press cycles Warm Glow → Natural → Candle → Wifi RSSI → Color → Magic.
select:
  - platform: template
    name: "Preset"
    id: candle_preset
    icon: mdi:candle
    optimistic: true
    # Do not restore last scene — a high-power preset after brownout would loop.
    restore_value: false
    initial_option: "Off"
    options:
      - "Off"
      - "Warm Glow"
      - "Natural"
      - "Ember"
      - "UV Accent"
      - "Candle"
      - "Wifi RSSI"
      - "Color"
      - "Magic"
      - "Custom"
    set_action:
      - lambda: |-
          id(applying_preset) = true;
          auto sync_levels = [](float white_pct, float red_pct, float uv_pct) {
            id(white_level).publish_state(white_pct);
            id(red_level).publish_state(red_pct);
            id(uv_level).publish_state(uv_pct);
            id(white_enable).publish_state(white_pct > 0.5f);
            id(red_enable).publish_state(red_pct > 0.5f);
            id(uv_enable).publish_state(uv_pct > 0.5f);
          };
          // Scene apply: turn on, set master brightness, start effect.
          // Effects scale all channels by brightness×state (master_level).
          auto soft_effect = [](const char *effect, float brightness, bool rgb_on) {
            id(rgb_enable).publish_state(rgb_on);
            auto rgb = id(rgb_strip).turn_on();
            rgb.set_rgb(0.0f, 0.0f, 0.0f);
            rgb.set_brightness(brightness);
            rgb.set_effect(effect);
            rgb.perform();
          };

          if (x == "Off") {
            id(pwm_led_1).set_level(0.0f);
            id(pwm_led_2).set_level(0.0f);
            id(pwm_led_3).set_level(0.0f);
            id(pwm_led_4).set_level(0.0f);
            sync_levels(0, 0, 0);
            id(rgb_enable).publish_state(false);
            id(rgb_strip).turn_off().perform();
          } else if (x == "Warm Glow") {
            sync_levels(10, 40, 0);
            soft_effect("Warm Glow", 0.60f, false);
          } else if (x == "Natural") {
            sync_levels(100, 0, 0);
            soft_effect("Natural", 0.50f, true);
          } else if (x == "Ember") {
            sync_levels(2, 10, 0);
            soft_effect("Ember", 0.45f, false);
          } else if (x == "UV Accent") {
            sync_levels(0, 0, 50);
            soft_effect("UV Accent", 0.40f, true);
          } else if (x == "Candle") {
            // Effect owns the flicker; publish indicative levels so White/Red
            // enables match what the scene actually drives.
            sync_levels(60, 20, 0);
            soft_effect("Candle", 0.40f, false);
          } else if (x == "Wifi RSSI") {
            // White tracks signal; red may appear when weak. Indicative mid.
            sync_levels(50, 15, 0);
            soft_effect("Wifi RSSI", 0.70f, true);
          } else if (x == "Color") {
            sync_levels(0, 0, 0);
            soft_effect("Color", 0.50f, true);
          } else if (x == "Magic") {
            // Effect owns red (~40%) + UV (~55%) + RGB; sync UI to that.
            sync_levels(0, 40, 55);
            soft_effect("Magic", 0.45f, true);
          } else if (x == "Custom") {
            // Manual mode. Stop a running scene (RGB off — no white jump).
            // From Off the effect is already None; leave RGB as the user set it.
            espcandle::stop_scene_effect();
            espcandle::apply_custom_pwm();
          }
          id(applying_preset) = false;

  # Which LED board is fitted (version on its silkscreen). Stored in flash, so
  # it survives reboots and OTA updates; the default for a fresh flash is the
  # top_board substitution. See the white_v1x_* substitutions above.
  - platform: template
    name: "Top Board"
    id: top_board
    icon: mdi:chip
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "${top_board}"
    options:
      - "v1.3"
      - "v1.4"
      - "v1.6"
    on_value:
      - if:
          condition:
            lambda: "return id(top_board_ready);"
          then:
            - script.execute:
                id: apply_top_board
                index: !lambda "return i;"

# -- Channel levels + enables (Custom / device page) ------------------------
# Scenes own outputs while selected. Any slider/enable change → Custom.
# In Custom, PWM is absolute (level × enable, not gated by the RGB light).
# set_action uses `x` because optimistic publish_state runs after set_action.
# Levels and Preset do not restore: boot is always Off / 0% (brownout-loop).
number:
  - platform: template
    name: "White Brightness"
    id: white_level
    icon: mdi:lightbulb-outline
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: false
    set_action:
      - lambda: |-
          espcandle::on_channel_slider(x, id(red_level).state, id(uv_level).state, 'w');

  - platform: template
    name: "Red Intensity"
    id: red_level
    icon: mdi:circle
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: false
    set_action:
      - lambda: |-
          espcandle::on_channel_slider(id(white_level).state, x, id(uv_level).state, 'r');

  - platform: template
    name: "UV Intensity"
    id: uv_level
    icon: mdi:weather-night
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: false
    set_action:
      - lambda: |-
          espcandle::on_channel_slider(id(white_level).state, id(red_level).state, x, 'u');

switch:
  - platform: template
    name: "White"
    id: white_enable
    icon: mdi:lightbulb-outline
    optimistic: true
    restore_mode: ${switch_restore_mode}
    turn_on_action:
      - lambda: |-
          id(white_enable).publish_state(true);
          espcandle::on_channel_enable_changed();
    turn_off_action:
      - lambda: |-
          id(white_enable).publish_state(false);
          espcandle::on_channel_enable_changed();

  - platform: template
    name: "Red"
    id: red_enable
    icon: mdi:circle
    optimistic: true
    restore_mode: ${switch_restore_mode}
    turn_on_action:
      - lambda: |-
          id(red_enable).publish_state(true);
          espcandle::on_channel_enable_changed();
    turn_off_action:
      - lambda: |-
          id(red_enable).publish_state(false);
          espcandle::on_channel_enable_changed();

  - platform: template
    name: "UV"
    id: uv_enable
    icon: mdi:weather-night
    optimistic: true
    restore_mode: ${switch_restore_mode}
    turn_on_action:
      - lambda: |-
          id(uv_enable).publish_state(true);
          espcandle::on_channel_enable_changed();
    turn_off_action:
      - lambda: |-
          id(uv_enable).publish_state(false);
          espcandle::on_channel_enable_changed();

  # RGB Strip: gates WS2812 output only. Does not touch White/Red/UV PWM.
  # Scenes keep running (RGB writes black while off). Custom turns the light
  # off/on and preserves colour — never set_rgb(0,0,0) or stop scene effects.
  - platform: template
    name: "RGB Strip"
    id: rgb_enable
    icon: mdi:led-strip-variant
    optimistic: true
    restore_mode: ${switch_restore_mode}
    turn_on_action:
      - lambda: |-
          // Publish first — turn_on_action runs before optimistic state update.
          id(rgb_enable).publish_state(true);
          espcandle::rgb_strip_output_on();
    turn_off_action:
      - lambda: |-
          id(rgb_enable).publish_state(false);
          espcandle::rgb_strip_output_off();

# -- Boot button ------------------------------------------------------------
binary_sensor:
  - platform: status
    name: "Status"
    id: status_sensor
    entity_category: diagnostic
    disabled_by_default: true

  - platform: gpio
    pin:
      number: ${button_pin}
      mode: INPUT_PULLUP
      inverted: true
    name: "Boot Button"
    id: boot_button
    entity_category: diagnostic
    disabled_by_default: true
    filters:
      - delayed_on_off: 20ms
    on_multi_click:
      # Short press: cycle Warm Glow → Natural → Candle → Wifi RSSI → Color → Magic → …
      - timing:
          - ON for at most 1s
          - OFF for at least 0.2s
        then:
          - lambda: |-
              static const char *cycle[] = {
                  "Warm Glow", "Natural", "Candle", "Wifi RSSI", "Color", "Magic"};
              constexpr int n = 6;
              auto cur = id(candle_preset).current_option();
              int next = 0;
              for (int i = 0; i < n; i++) {
                if (cur == cycle[i]) {
                  next = (i + 1) % n;
                  break;
                }
              }
              auto call = id(candle_preset).make_call();
              call.set_option(cycle[next]);
              call.perform();
      # Long press (3–10s, then release): toggle RGB on/off.
      # Requires release so a 10s factory-reset hold does not also toggle.
      - timing:
          - ON for 3s to 10s
          - OFF for at least 0.1s
        then:
          - light.toggle: rgb_strip
      # Hold 10s: factory reset (wipe Wi-Fi / API key, re-enter provisioning)
      - timing:
          - ON for at least 10s
        then:
          - button.press: factory_reset_button

# -- Extra GPIOs as switches (modder/expansion only) -----------------------
# These GPIO10/11/12 pins are exposed as switches for tinkerers. On some
# ESP32-S3 modules these may be strapping or SPI/flash pins - verify your
# board before enabling. Commented out by default. See docs/modders.md.
#
