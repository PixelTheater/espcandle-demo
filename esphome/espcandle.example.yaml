# ESP Candle - per-device config (runtime-PSK path).
#
# Copy this file once per physical candle if you want a custom name
# baked in (no MAC suffix). Wi-Fi is provisioned via Improv (BLE or
# USB-CDC); the API key is negotiated at runtime by Home Assistant.
# No secrets.yaml is needed.
#
#   cp espcandle.example.yaml candle-livingroom.yaml
#   esphome run candle-livingroom.yaml
#
# For the generic factory image (MAC-suffixed name, web-flasher-ready),
# build esphome/espcandle.factory.factory.yaml instead.

substitutions:
  name: candle-livingroom
  friendly_name: Living Room Candle
  room: ""

packages:
  espcandle: !include espcandle.base.yaml

# Named per-device builds do not append the MAC suffix (the base sets
# name_add_mac_suffix: true; this overrides it for named devices).
esphome:
  name_add_mac_suffix: false
