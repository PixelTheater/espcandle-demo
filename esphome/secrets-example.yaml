# ESPHome secrets template
#
# Copy this file to esphome/secrets.yaml and fill in your real values.
# The real secrets.yaml is gitignored and must NEVER be committed.
#
# Security:
#   - Rotate these credentials if you ever suspect exposure (for example,
#     because secrets.yaml was copied, shared, or backed up to an
#     untrusted location). Treat the values below as one-time-use
#     examples only.
#   - Generate new API keys and OTA passwords with:
#       openssl rand -base64 32
#       openssl rand -hex 16

# Shared Wi-Fi credentials used by every candle.
wifi_ssid: "your-wifi-ssid"
wifi_password: "your-wifi-password"

# Fallback AP used when Wi-Fi is unavailable or first-time provisioning.
fallback_ap_password: "change-me-12-chars-min"

# --- Per-device secrets ---
# Repeat the two blocks below for every candle, giving each a unique
# <name>_api_key and <name>_ota_password. The <name> prefix must match the
# `name:` substitution in the corresponding esphome/<name>.yaml file.

candle_livingroom_api_key: "GENERATE_WITH_openssl_rand_-base64_32"
candle_livingroom_ota_password: "GENERATE_WITH_openssl_rand_-hex_16"
