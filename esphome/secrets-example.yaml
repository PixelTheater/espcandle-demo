# ESPHome secrets template - DEV / CI BUILD ONLY.
#
# The default factory and per-device example builds do NOT use this
# file. They use runtime Noise-PSK adoption (no baked-in key) and
# Improv Wi-Fi provisioning (no baked-in Wi-Fi creds). This file is
# only for users who want a fully offline, static-key build with no
# Home Assistant runtime adoption.
#
# Copy to esphome/secrets.yaml (gitignored) and fill in real values.
# Rotate credentials if you ever suspect exposure.
# Generate new API keys and OTA passwords with:
#   openssl rand -base64 32
#   openssl rand -hex 16

wifi_ssid: "your-wifi-ssid"
wifi_password: "your-wifi-password"
fallback_ap_password: "change-me-12-chars-min"
candle_livingroom_api_key: "GENERATE_WITH_openssl_rand_-base64_32"
candle_livingroom_ota_password: "GENERATE_WITH_openssl_rand_-hex_16"

# To use these in a per-device YAML, add (do not commit secrets.yaml):
#
#   wifi:
#     ssid: !secret wifi_ssid
#     password: !secret wifi_password
#     ap:
#       password: !secret fallback_ap_password
#   api:
#     encryption:
#       key: !secret candle_livingroom_api_key
#   ota:
#     - platform: esphome
#       password: !secret candle_livingroom_ota_password
