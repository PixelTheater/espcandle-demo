# ESP Candle - factory flash image (bench / web flasher).
#
# Bench-flash / web-flasher entry point. Same config as espcandle.factory.yaml
# for now. HTTP self-update is disabled until a release publishes a real
# manifest.json + firmware.ota.bin (fetching the unpublished URL only
# produced boot-time 404 noise). Local ESPHome OTA from HA still works via
# the base `ota: - platform: esphome` block.
#
# Users (and the Device Builder) should import espcandle.factory.yaml,
# not this file.

packages:
  factory: !include espcandle.factory.yaml

