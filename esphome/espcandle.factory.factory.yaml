# ESP Candle - factory flash image (bench / web flasher).
#
# This is the binary flashed to each candle at the bench or via
# web.esphome.io. It extends espcandle.factory.yaml with an
# http_request OTA + update component so Home Assistant can offer
# firmware updates from the GitHub-hosted manifest.
#
# Users (and the Device Builder) should import espcandle.factory.yaml,
# not this file.

packages:
  factory: !include espcandle.factory.yaml

# Add HTTPS OTA alongside the base's esphome-platform OTA. Both are
# active; the base's local OTA is unchanged.
ota:
  - platform: http_request
    id: ota_http_request

update:
  - platform: http_request
    id: update_http_request
    name: Firmware
    source: https://raw.githubusercontent.com/PixelTheater/espcandle-demo/main/esphome/manifest.json

http_request:
