; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
; Pin pioarduino espressif32 (Arduino-ESP32 3.x / IDF 5.5). Unpinned
; `espressif32` resolves to registry 7.0.1 (Arduino 2.x) on clean CI and
; fails on ledcAttach() — that API exists only in Arduino-ESP32 3.x.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
upload_protocol = esptool
upload_speed = 200000
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder
lib_deps =
    fastled/FastLED @ ^3.6.0
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; USB: candle USB-C is wired to the ESP32-S3 USB-Serial/JTAG peripheral
    ; (esptool reports "USB mode: USB-Serial/JTAG"). ARDUINO_USB_MODE=1 +
    ; CDC_ON_BOOT route Serial to that interface. MODE=0 (TinyUSB OTG) makes
    ; the port renumber/drop after reset — monitor then loops on Errno 6.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Custom ESP Candle PCB. boards/espcandle.json is a project-local board
; definition (PlatformIO boards_dir): ESP32-S3 with 4MB flash + 2MB quad
; PSRAM — same memory profile as Espressif ESP32-S3-DevKitC-1-N4R2.
; Pinout is candle-specific (see README / src/config.h), not DevKitC.
; https://docs.platformio.org/en/latest/platforms/creating_board.html
;
; One env per top board (the LED board; see src/config.h, "Top board"):
; esp32s3 is the v1.4 top, as before.
[env:esp32s3]
board = espcandle

[env:esp32s3-top-v13]
extends = env:esp32s3
build_flags =
    ${env.build_flags}
    -DESPCANDLE_TOP=13

[env:esp32s3-top-v16]
extends = env:esp32s3
build_flags =
    ${env.build_flags}
    -DESPCANDLE_TOP=16
