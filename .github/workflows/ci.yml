# CI: no-hardware gates for ESP Candle firmwares.
#
# - esphome-smoke: validate all ESPHome YAMLs + compile factory image
# - pio-demo: compile the standalone PlatformIO demo firmware
#
# On-device / HA checks remain manual (see docs/testing.md).

name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  esphome-smoke:
    name: ESPHome smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: esphome/requirements.txt

      - name: Install ESPHome
        run: pip install -r esphome/requirements.txt

      - name: Cache ESPHome / PlatformIO build
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            esphome/.esphome
          key: esphome-${{ runner.os }}-${{ hashFiles('esphome/requirements.txt', 'esphome/**/*.yaml', 'esphome/includes/**') }}
          restore-keys: |
            esphome-${{ runner.os }}-

      - name: Smoke test (config + compile factory)
        # Prefer PATH esphome (no local .venv in CI).
        run: make smoke-test ESPHOME=esphome

  pio-demo:
    name: PlatformIO demo build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install PlatformIO
        run: pip install platformio

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'boards/**', 'src/**', 'include/**') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Build esp32s3 env
        run: pio run -e esp32s3
